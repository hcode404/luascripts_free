<div class="lg:col-span-3 mb-12">
    <h2 class="text-3xl font-bold text-white mb-6 flex items-center gap-3">
        <span class="text-blue-500">/</span> מרכז הלמידה של SMAI
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="cyber-card p-6 rounded-2xl border-l-4 border-l-yellow-500">
            <h3 class="text-xl font-bold text-yellow-500 mb-2">Cross-Site Scripting (XSS)</h3>
            <p class="text-slate-400 text-sm mb-4">איך האקרים מזריקים קוד זדוני לאתרים וגונבים עוגיות (Cookies).</p>
            <button onclick="showLesson('xss')" class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded text-xs transition">למד איך להתגונן</button>
        </div>

        <div class="cyber-card p-6 rounded-2xl border-l-4 border-l-red-600">
            <h3 class="text-xl font-bold text-red-600 mb-2">Worm Virus (וירוס תולעת)</h3>
            <p class="text-slate-400 text-sm mb-4">וירוס שמשכפל את עצמו ברשת ללא עזרת אדם. למד איך רשתות קורסות.</p>
            <button onclick="showLesson('worm')" class="bg-red-700 hover:bg-red-600 text-white font-bold py-2 px-4 rounded text-xs transition">למד על שכפול והגנה</button>
        </div>

    </div>
</div>

<div id="lessonModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
    <div class="cyber-card max-w-2xl w-full p-8 rounded-3xl overflow-y-auto max-h-[90vh]">
        <div id="lessonContent"></div>
        <button onclick="closeLesson()" class="mt-6 text-slate-500 hover:text-white underline text-sm">סגור שיעור</button>
    </div>
</div>
