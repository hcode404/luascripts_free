<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SMAI | Locked Script Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Segoe UI', sans-serif; }
        /* עיצוב כרטיס נעול */
        .script-card { background: #0f172a; border: 1px solid #1e40af; filter: blur(3px); pointer-events: none; transition: 0.5s; opacity: 0.4; position: relative; }
        /* עיצוב כרטיס פתוח */
        .unlocked { filter: blur(0); pointer-events: auto; opacity: 1; transform: scale(1); }
        .smai-btn { background: linear-gradient(90deg, #1e40af, #3b82f6); transition: 0.3s; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .smai-btn:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.7); transform: scale(1.05); }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; font-size: 2rem; }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="text-center mb-12">
        <h1 class="text-5xl font-black text-blue-500 italic mb-2 tracking-tighter">SMAI SCRIPT HUB</h1>
        
        <div id="unlock-section" class="bg-slate-900 border-2 border-blue-500/50 p-8 rounded-3xl max-w-xl mx-auto mt-8 shadow-2xl">
            <h2 class="text-2xl font-bold mb-4 text-white">🔐 התוכן נעול!</h2>
            <p class="text-slate-400 mb-6">כדי לקבל גישה לכל הצ'יטים והסקריפטים של SMAI, עליך להירשם לערוץ היוטיוב שלנו **anonowner**.</p>
            
            <a href="https://www.youtube.com/@anonowner?sub_confirmation=1" 
               target="_blank" 
               onclick="unlockContent()" 
               class="smai-btn inline-block px-12 py-5 rounded-2xl font-black text-white text-lg">
                הירשם ליוטיוב כדי לפתוח 🔴
            </a>
        </div>
    </header>

    <div id="scriptsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
        </div>

    

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYDkAmoXztR7LdsXdY_GQzgZLnzoDZolg",
            authDomain: "sspeak-90bf3.firebaseapp.com",
            projectId: "sspeak-90bf3",
            storageBucket: "sspeak-90bf3.firebasestorage.app",
            messagingSenderId: "664670416687",
            appId: "1:664670416687:web:0e7430338b37d041cc7bda",
            measurementId: "G-JE78RMNKEX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // פונקציית פתיחה
        window.unlockContent = () => {
            // שמירה בדפדפן שהמשתמש נרשם
            localStorage.setItem('smai_hub_unlocked', 'true');
            
            // אנימציה קטנה של טעינה
            document.querySelector('#unlock-section h2').innerText = "בודק הרשמה...";
            
            setTimeout(() => {
                applyUnlock();
                alert("תודה על ההרשמה ל-anonowner! כל הסקריפטים פתוחים עבורך.");
            }, 3000); // השהייה של 3 שניות כדי לתת להם זמן ללחוץ על סאב
        };

        function applyUnlock() {
            const section = document.getElementById('unlock-section');
            if(section) section.classList.add('hidden');
            
            const cards = document.querySelectorAll('.script-card');
            cards.forEach(card => {
                card.classList.add('unlocked');
                const icon = card.querySelector('.lock-icon');
                if(icon) icon.remove();
            });
        }

        // טעינת הנתונים
        onSnapshot(collection(db, "scripts"), (snapshot) => {
            const grid = document.getElementById('scriptsGrid');
            grid.innerHTML = "";
            const isAlreadyUnlocked = localStorage.getItem('smai_hub_unlocked') === 'true';

            snapshot.forEach(sDoc => {
                const s = sDoc.data();
                grid.innerHTML += `
                    <div class="script-card p-6 rounded-3xl shadow-xl flex flex-col justify-between ${isAlreadyUnlocked ? 'unlocked' : ''}">
                        ${!isAlreadyUnlocked ? '<div class="lock-icon text-blue-500">🔒</div>' : ''}
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-xl font-bold text-white">${s.title}</h3>
                                <span class="bg-blue-900 text-blue-300 text-[10px] px-2 py-1 rounded-full uppercase font-black">${s.game}</span>
                            </div>
                            <p class="text-slate-400 text-sm mb-6 leading-relaxed">${s.description || 'אין תיאור לסקריפט זה.'}</p>
                        </div>
                        <button onclick="copyScript('${sDoc.id}', \`${s.code}\`)" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-sm transition flex justify-center items-center gap-2">
                            העתק קוד LUA 📋
                        </button>
                    </div>
                `;
            });

            if(isAlreadyUnlocked) applyUnlock();
        });

        window.copyScript = async (id, code) => {
            try {
                await navigator.clipboard.writeText(code);
                alert("הסקריפט הועתק! ניתן להדביק ב-Executor.");
                const scriptRef = doc(db, "scripts", id);
                await updateDoc(scriptRef, { downloads: increment(1) });
            } catch (err) {
                alert("שגיאה בהעתקה. נסה שוב.");
            }
        };
    </script>
</body>
</html>
