<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SMAI | Cyber Challenge Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #3b82f6; font-family: 'Courier New', monospace; }
        .cyber-card { background: rgba(15, 23, 42, 0.9); border: 1px solid #1e40af; box-shadow: 0 0 20px rgba(30, 64, 175, 0.3); }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; pointer-events: none; }
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="matrix-bg" id="matrix"></div>

    <header class="text-center mb-12">
        <h1 class="text-5xl font-black text-blue-500 mb-2 glitch uppercase tracking-tighter">SMAI Cyber Academy</h1>
        <p class="text-slate-400 font-bold tracking-widest text-sm">אתר לתרגול חדירה ובדיקות אבטחה</p>
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-6">
            <h2 class="text-2xl font-bold text-white mb-4 flex items-center gap-2">
                <span>[</span> אתגרים פעילים <span>]</span>
            </h2>
            <div id="challengesGrid" class="grid gap-6">
                </div>
        </div>

        <div class="cyber-card p-6 rounded-3xl h-fit">
            <h2 class="text-xl font-bold text-white mb-6 border-b border-blue-900 pb-2">TOP HACKERS 🏆</h2>
            <div id="leaderboard" class="space-y-4 text-sm">
                <p class="text-slate-500 italic">טוען דירוג...</p>
            </div>
        </div>
    </div>

    

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYDkAmoXztR7LdsXdY_GQzgZLnzoDZolg",
            authDomain: "sspeak-90bf3.firebaseapp.com",
            projectId: "sspeak-90bf3",
            storageBucket: "sspeak-90bf3.firebasestorage.app",
            messagingSenderId: "664670416687",
            appId: "1:664670416687:web:0e7430338b37d041cc7bda",
            measurementId: "G-JE78RMNKEX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // טעינת אתגרים
        onSnapshot(collection(db, "challenges"), (snapshot) => {
            const grid = document.getElementById('challengesGrid');
            grid.innerHTML = "";
            snapshot.forEach(doc => {
                const c = doc.data();
                grid.innerHTML += `
                    <div class="cyber-card p-6 rounded-2xl">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-bold text-blue-400">${c.title}</h3>
                            <span class="text-xs bg-blue-950 text-blue-300 px-2 py-1 rounded border border-blue-800">${c.points} PTS</span>
                        </div>
                        <p class="text-slate-300 text-sm mb-6">${c.description}</p>
                        <div class="flex gap-2">
                            <input id="flag-${doc.id}" type="text" placeholder="הכנס Flag כאן..." class="flex-1 bg-black border border-blue-900 p-2 rounded text-sm outline-none focus:border-blue-500 text-white">
                            <button onclick="submitFlag('${doc.id}', '${c.flag}', ${c.points})" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded text-white font-bold text-sm transition">שלח</button>
                        </div>
                    </div>
                `;
            });
        });

        // טעינת Leaderboard
        const qLeader = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
        onSnapshot(qLeader, (snapshot) => {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                lb.innerHTML += `
                    <div class="flex justify-between items-center border-b border-blue-900/30 pb-2">
                        <span class="text-slate-300">${data.username}</span>
                        <span class="font-bold text-blue-400">${data.score}</span>
                    </div>
                `;
            });
        });

        window.submitFlag = async (docId, correctFlag, points) => {
            const input = document.getElementById(`flag-${docId}`);
            if (input.value === correctFlag) {
                const username = prompt("כל הכבוד האקר! הכנס כינוי לטבלת הניקוד:");
                if (username) {
                    await addDoc(collection(db, "leaderboard"), {
                        username: username,
                        score: points,
                        timestamp: serverTimestamp()
                    });
                    alert("ה-Flag נכון! הניקוד שלך התעדכן.");
                }
            } else {
                alert("קוד שגוי. נסה שוב.");
            }
        };
    </script>
</body>
</html>
